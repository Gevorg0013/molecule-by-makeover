<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Molecule by Makeover — premium hair & beard care." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shown while the JS bundle loads on a direct load/refresh; React replaces it on mount and
         RouteProgress picks up from the same 30% point. Literal colour: index.css isn't applied yet. */
      #boot-progress { position: fixed; inset: 0 0 auto 0; z-index: 100; height: 3px; pointer-events: none; }
      #boot-progress::after { content: ''; display: block; height: 100%; transform-origin: left; transform: scaleX(0.3);
        background: oklch(0.7 0.12 75); box-shadow: 0 0 8px oklch(0.7 0.12 75); animation: boot-progress 1s ease-out; }
      @keyframes boot-progress { from { transform: scaleX(0.05); } }
      @media (max-width: 639px) { #boot-progress { height: 2px; } }
    </style>
    <title>Molecule by Makeover</title>
  </head>
  <body>
    <div id="root"><div id="boot-progress" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
